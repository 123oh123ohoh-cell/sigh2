    <style>
                .profile-dropdown .dropdown-content {
                    display: none;
                }
                .profile-dropdown .dropdown-content.show,
                .profile-dropdown.show .dropdown-content {
                    display: block;
                }
        body {
            background: radial-gradient(ellipse at center, #ffb6d5 0%, #ff69b4 60%, #d72660 100%);
        }
        .arts-gallery-page {
            min-height: 90vh;
            background: transparent;
            padding: 80px 0 24px 0;
            position: relative;
        }
        .arts-gallery-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(255,182,213,0.7) 0%, rgba(255,105,180,0.3) 60%, rgba(215,38,96,0.2) 100%);
            z-index: 0;
            pointer-events: none;
        }
        .arts-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .arts-card {
            background: linear-gradient(145deg, #fff0fa 60%, #ffb6d5 100%);
            border-radius: 22px 22px 32px 32px;
            padding: 18px 16px 22px 16px;
            width: 240px;
            box-shadow: 0 4px 24px 4px rgba(255,105,180,0.18), 0 1.5px 0 #fff inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2.5px solid #ff69b4;
            position: relative;
            overflow: hidden;
        }
        .arts-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 38px;
            background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.09) 100%);
            border-radius: 22px 22px 0 0;
            pointer-events: none;
        }
        .arts-card img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 50% 50% 40% 40%/60% 60% 40% 40%;
            background: #fff0fa;
            box-shadow: 0 2px 16px 2px rgba(255,182,213,0.25);
            border: 3px solid #ff69b4;
            margin-bottom: 8px;
        }
        .arts-card .title {
            margin-top: 10px;
            font-weight: bold;
            color: #d72660;
            font-size: 1.18em;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 8px #fff0fa;
        }
        .arts-card .author {
            font-size: 1em;
            color: #ff69b4;
            margin: 4px 0 6px 0;
            font-weight: 500;
        }
        .arts-card .desc {
            font-size: 1em;
            color: #d72660;
            min-height: 32px;
            text-align: center;
            font-style: italic;
        }
        .arts-card .date {
            font-size: 0.9em;
            color: #b3005e;
            margin-top: 6px;
        }
        .post-art-section {
            margin-top: 28px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .post-art-section form {
            background: linear-gradient(120deg, #fff0fa 60%, #ffb6d5 100%);
            border-radius: 18px;
            border: 2px solid #ff69b4;
            box-shadow: 0 2px 16px 2px rgba(255,182,213,0.18);
        }
        .post-art-section input,
        .post-art-section textarea {
            background: #fff0fa;
            border: 1.5px solid #ff69b4;
            color: #d72660;
        }
        .post-art-section button {

            font-weight: 700;
            border: none;
            border-radius: 8px;

        <script>
                // Dropdown toggle logic
                document.addEventListener('DOMContentLoaded', function() {
                    const dropdownBtn = document.getElementById('profileDropdownBtn');
                    const dropdownMenu = document.getElementById('profileDropdownMenu');
                    if (dropdownBtn && dropdownMenu) {
                        dropdownBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            dropdownMenu.classList.toggle('show');
                        });
                        document.addEventListener('click', function(e) {
                            if (!dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
                                dropdownMenu.classList.remove('show');
                            }
                        });
                    }
                });
        document.addEventListener('DOMContentLoaded', function() {
            async function updateDropdownMenu() {
                const loggedInUser = localStorage.getItem('loggedInUser');
                const token = localStorage.getItem('token');
                const profileLink = document.getElementById('profileLink');
                const signoutLink = document.getElementById('signoutLink');
                const dropdownLogin = document.getElementById('dropdownLogin');
                const dropdownSignup = document.getElementById('dropdownSignup');
                const premiumBadgeHeader = document.getElementById('premiumBadgeHeader');
                const profileAvatarIcon = document.getElementById('profileAvatarIcon');
                const profileAvatarFallback = document.getElementById('profileAvatarFallback');
                if (loggedInUser && token) {
                    if (profileLink) profileLink.style.display = '';
                    if (signoutLink) signoutLink.style.display = '';
                    if (dropdownLogin) dropdownLogin.style.display = 'none';
                    if (dropdownSignup) dropdownSignup.style.display = 'none';
                    // Fetch premiumTier and avatar from backend
                    let premiumTier = '';
                    let avatar = '';
                    try {
                        const res = await fetch('https://ownshub.onrender.com/api/profile', {
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            premiumTier = data.premiumTier;
                            avatar = data.avatar;
                        }
                    } catch {}
                    if (premiumBadgeHeader) {
                        if (premiumTier) {
                            let color = '#ffd700';
                            if (premiumTier === 'Silver') color = '#c0c0c0';
                            if (premiumTier === 'Bronze') color = '#cd7f32';
                            premiumBadgeHeader.innerHTML = `<span style=\"padding:1.5px 8px;border-radius:7px;background:${color};color:#181818;font-size:0.82em;font-weight:bold;vertical-align:middle;box-shadow:0 1px 4px #0002;letter-spacing:0.5px;\">${premiumTier} Premium</span>`;
                        } else {
                            premiumBadgeHeader.innerHTML = '';
                        }
                    }
                    // Set avatar icon
                    if (profileAvatarIcon && avatar) {
                        profileAvatarIcon.src = avatar;
                        profileAvatarIcon.style.display = '';
                        if (profileAvatarFallback) profileAvatarFallback.style.display = 'none';
                    } else {
                        if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
                        if (profileAvatarFallback) profileAvatarFallback.style.display = '';
                    }
                } else {
                    if (profileLink) profileLink.style.display = 'none';
                    if (signoutLink) signoutLink.style.display = 'none';
                    if (dropdownLogin) dropdownLogin.style.display = '';
                    if (dropdownSignup) dropdownSignup.style.display = '';
                    if (premiumBadgeHeader) premiumBadgeHeader.innerHTML = '';
                    if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
                    if (profileAvatarFallback) profileAvatarFallback.style.display = '';
                }
            }
            updateDropdownMenu();
            window.addEventListener('storage', function(e) {
                if (e.key === 'loggedInUser') {
                    updateDropdownMenu();
                }
            });
        });
        </script>
