<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - own's hub</title>
        <link rel="stylesheet" href="styles.css">
<script src="theme-mode.js"></script>
        <link rel="stylesheet" href="profile.css">
        <link rel="stylesheet" href="settings.css">
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
</head>
<body class="settings-page">
    <header class="header">
        <a href="index.html" class="logo">
            <img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:32px;vertical-align:middle;margin-right:8px;">
        </a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="login.html" class="nav-link" id="loginNav">Login</a>
            <a href="signup.html" class="nav-link" id="signupNav">Create Account</a>
            <a href="profile.html" class="nav-link" id="profileNav">Profile</a>
            <a href="signout.html" class="nav-link" id="signoutNav">Sign Out</a>
            <script>
            // Responsive nav links for login state
            document.addEventListener('DOMContentLoaded', function() {
                const loggedInUser = localStorage.getItem('loggedInUser');
                const loginNav = document.getElementById('loginNav');
                const signupNav = document.getElementById('signupNav');
                const profileNav = document.getElementById('profileNav');
                const signoutNav = document.getElementById('signoutNav');
                if (loggedInUser) {
                    if (loginNav) loginNav.style.display = 'none';
                    if (signupNav) signupNav.style.display = 'none';
                    if (profileNav) profileNav.style.display = '';
                    if (signoutNav) signoutNav.style.display = '';
                } else {
                    if (loginNav) loginNav.style.display = '';
                    if (signupNav) signupNav.style.display = '';
                    if (profileNav) profileNav.style.display = 'none';
                    if (signoutNav) signoutNav.style.display = 'none';
                }
            });
            </script>
        </nav>
    </header>
    <main class="profile-main">
        <div class="profile-container">
            <h2 style="margin-bottom:0.5em;color:#d12a7a;">Settings</h2>
            <div class="settings-layout">
                <div class="settings-sidebar">
                    <button class="settings-tab active" data-tab="account">Account</button>
                    <button class="settings-tab" data-tab="notifications">Notifications</button>
                    <button class="settings-tab" data-tab="appearance">Appearance</button>
                    <button class="settings-tab" data-tab="security">Security</button>
                </div>
                <div class="settings-content">
                    <div class="settings-panel" id="tab-account">
                        <h3>Account</h3>
                        <form id="accountForm" class="profile-form">
                            <label>Display Name
                                <input type="text" id="accountDisplayName" maxlength="32">
                            </label>
                            <label>Email
                                <input type="email" id="accountEmail">
                            </label>
                            <button type="submit">Save Account</button>
                        </form>
                        <div id="accountSavedMsg" style="display:none;color:green;margin-top:12px;font-weight:bold;">Account saved!</div>
                    </div>
                    <div class="settings-panel" id="tab-notifications" style="display:none;">
                        <h3>Notifications</h3>
                        <form id="notificationsForm" class="profile-form">
                            <label>Email Notifications
                                <select id="emailNotifications">
                                    <option value="on">On</option>
                                    <option value="off">Off</option>
                                </select>
                            </label>
                            <label>SMS Notifications
                                <select id="smsNotifications">
                                    <option value="on">On</option>
                                    <option value="off">Off</option>
                                </select>
                            </label>
                            <button type="submit">Save Notifications</button>
                        </form>
                        <div id="notificationsSavedMsg" style="display:none;color:green;margin-top:12px;font-weight:bold;">Notifications saved!</div>
                    </div>
                    <div class="settings-panel" id="tab-appearance" style="display:none;">
                        <h3>Appearance</h3>
                        <form id="appearanceForm" class="profile-form">
                            <div class="appearance-block">
                                <span class="appearance-label">Theme Mode</span>
                                <div class="mode-toggle" role="group" aria-label="Theme mode">
                                    <button type="button" class="mode-btn theme-mode-btn" id="lightModeBtn" data-mode="light" aria-label="Light mode">
                                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Ccircle cx='12' cy='12' r='4.5' stroke='%23000000' stroke-width='2'/%3E%3Cpath d='M12 1.8v2.7M12 19.5v2.7M4.22 4.22l1.9 1.9M17.88 17.88l1.9 1.9M1.8 12h2.7M19.5 12h2.7M4.22 19.78l1.9-1.9M17.88 6.12l1.9-1.9' stroke='%23000000' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" alt="">
                                        <span>Light</span>
                                    </button>
                                    <button type="button" class="mode-btn theme-mode-btn" id="darkModeBtn" data-mode="dark" aria-label="Dark mode">
                                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M20.2 14.3A8.7 8.7 0 1 1 9.7 3.8a7.3 7.3 0 1 0 10.5 10.5Z' fill='%23000000'/%3E%3C/svg%3E" alt="">
                                        <span>Dark</span>
                                    </button>
                                </div>
                            </div>
                            <div class="appearance-block" style="margin-top:14px;">
                                <span class="appearance-label">Accent Color</span>
                                <div id="colorPalette" style="display:flex;gap:14px;flex-wrap:wrap;">
                                    <span class="color-circle" data-color="#d12a7a" style="background:#d12a7a;"></span>
                                    <span class="color-circle" data-color="#ffb347" style="background:#ffb347;"></span>
                                    <span class="color-circle" data-color="#ffd700" style="background:#ffd700;"></span>
                                    <span class="color-circle" data-color="#69b4ff" style="background:#69b4ff;"></span>
                                    <span class="color-circle" data-color="#4caf50" style="background:#4caf50;"></span>
                                    <span class="color-circle" data-color="#ff2222" style="background:#ff2222;"></span>
                                    <span class="color-circle" data-color="#b347ff" style="background:#b347ff;"></span>
                                    <span class="color-circle" data-color="#222" style="background:#222;"></span>
                                </div>
                            </div>
                            <div class="appearance-block" style="margin-top:14px;">
                                <span class="appearance-label">Special Modes</span>
                                <div class="mode-toggle" role="group" aria-label="Special modes">
                                    <button type="button" class="mode-btn special-mode-btn" id="donkModeBtn" data-special="donk" aria-label="Donk mode">
                                        <span>Donk</span>
                                    </button>
                                    <button type="button" class="mode-btn special-mode-btn" id="momModeBtn" data-special="mom" aria-label="Mom mode">
                                        <span>Mom</span>
                                    </button>
                                </div>
                            </div>
                            <button type="submit">Save Appearance</button>
                        </form>
                        <div id="appearanceSavedMsg" style="display:none;color:green;margin-top:12px;font-weight:bold;">Appearance saved!</div>
                    </div>
                    <div class="settings-panel" id="tab-security" style="display:none;">
                        <h3>Security</h3>
                        <form id="securityForm" class="profile-form">
                            <label>Change Password
                                <input type="password" id="newPassword" placeholder="New Password">
                            </label>
                            <button type="submit">Change Password</button>
                        </form>
                        <button type="button" id="deleteAccountBtn">Delete Account</button>
                        <div id="securitySavedMsg" style="display:none;color:green;margin-top:12px;font-weight:bold;">Security updated!</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
    // Tab switching logic
    document.querySelectorAll('.settings-tab').forEach(function(tabBtn) {
        tabBtn.addEventListener('click', function() {
            document.querySelectorAll('.settings-tab').forEach(btn => btn.classList.remove('active'));
            tabBtn.classList.add('active');
            document.querySelectorAll('.settings-panel').forEach(panel => panel.style.display = 'none');
            document.getElementById('tab-' + tabBtn.dataset.tab).style.display = '';
        });
    });

    // Account form
    document.getElementById('accountForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('accountSavedMsg').style.display = 'block';
        setTimeout(function(){
            document.getElementById('accountSavedMsg').style.display = 'none';
        }, 2000);
    };
    // Notifications form
    document.getElementById('notificationsForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('notificationsSavedMsg').style.display = 'block';
        setTimeout(function(){
            document.getElementById('notificationsSavedMsg').style.display = 'none';
        }, 2000);
    };
    // Appearance form
    const appearanceState = {
        mode: 'dark',
        accent: '#d12a7a',
        donkEnabled: false,
        momEnabled: false
    };

    function updateModeButtons(mode) {
        document.querySelectorAll('.theme-mode-btn').forEach(function(btn) {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
    }

    function updateSpecialButtons() {
        const donkBtn = document.getElementById('donkModeBtn');
        const momBtn = document.getElementById('momModeBtn');
        if (donkBtn) {
            donkBtn.classList.toggle('active', appearanceState.donkEnabled);
            donkBtn.setAttribute('aria-pressed', appearanceState.donkEnabled ? 'true' : 'false');
            donkBtn.setAttribute('data-state', appearanceState.donkEnabled ? 'on' : 'off');
        }
        if (momBtn) {
            momBtn.classList.toggle('active', appearanceState.momEnabled);
            momBtn.setAttribute('aria-pressed', appearanceState.momEnabled ? 'true' : 'false');
            momBtn.setAttribute('data-state', appearanceState.momEnabled ? 'on' : 'off');
        }
    }

    function setMode(mode, persist) {
        const validModes = ['light', 'dark'];
        const normalized = validModes.includes(mode) ? mode : 'dark';
        appearanceState.mode = normalized;
        updateModeButtons(normalized);
        if (persist !== false) {
            localStorage.setItem('appearanceTheme', normalized);
            localStorage.setItem('theme', normalized);
        }
        if (typeof window.applySavedAppearance === 'function') {
            window.applySavedAppearance();
        }
    }

    function toggleSpecialMode(modeName, persist) {
        if (modeName === 'donk') {
            appearanceState.donkEnabled = !appearanceState.donkEnabled;
            if (persist !== false) {
                localStorage.setItem('appearanceDonk', appearanceState.donkEnabled ? 'on' : 'off');
            }
        }
        if (modeName === 'mom') {
            appearanceState.momEnabled = !appearanceState.momEnabled;
            if (persist !== false) {
                localStorage.setItem('appearanceMom', appearanceState.momEnabled ? 'on' : 'off');
            }
        }
        updateSpecialButtons();
        if (typeof window.applySavedAppearance === 'function') {
            window.applySavedAppearance();
        }
    }

    function setAccentColor(color, persist) {
        appearanceState.accent = color;
        if (persist !== false) {
            localStorage.setItem('appearanceAccent', color);
        }
        if (typeof window.applySavedAppearance === 'function') {
            window.applySavedAppearance();
        }
    }

    function updateColorPaletteUI(selectedColor) {
        document.querySelectorAll('.color-circle').forEach(function(circle) {
            if (circle.getAttribute('data-color') === selectedColor) {
                circle.classList.add('selected');
            } else {
                circle.classList.remove('selected');
            }
        });
    }

    document.getElementById('lightModeBtn').addEventListener('click', function() {
        setMode('light');
    });

    document.getElementById('darkModeBtn').addEventListener('click', function() {
        setMode('dark');
    });

    document.getElementById('donkModeBtn').addEventListener('click', function() {
        toggleSpecialMode('donk');
    });

    document.getElementById('momModeBtn').addEventListener('click', function() {
        toggleSpecialMode('mom');
    });

    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = (localStorage.getItem('appearanceTheme') || '').toLowerCase();
        const legacyDonk = localStorage.getItem('appearanceDonk') === 'on';
        const legacyMom = localStorage.getItem('appearanceMom') === 'on';
        let initialTheme = 'dark';
        if (['light', 'dark'].includes(savedTheme)) {
            initialTheme = savedTheme;
        }
        // Migrate legacy single-theme values to toggle flags.
        if (savedTheme === 'donk') {
            appearanceState.donkEnabled = true;
            localStorage.setItem('appearanceDonk', 'on');
            localStorage.setItem('appearanceTheme', 'dark');
        } else if (savedTheme === 'mom') {
            appearanceState.momEnabled = true;
            localStorage.setItem('appearanceMom', 'on');
            localStorage.setItem('appearanceTheme', 'dark');
        }
        setMode(initialTheme, false);
        appearanceState.donkEnabled = appearanceState.donkEnabled || legacyDonk;
        appearanceState.momEnabled = appearanceState.momEnabled || legacyMom;
        updateSpecialButtons();

        // Accent color palette
        const palette = document.getElementById('colorPalette');
        if (palette) {
            palette.addEventListener('click', function(e) {
                if (e.target.classList.contains('color-circle')) {
                    const color = e.target.getAttribute('data-color');
                    setAccentColor(color);
                    updateColorPaletteUI(color);
                }
            });
            // Restore accent color from localStorage
            const savedColor = localStorage.getItem('appearanceAccent') || '#d12a7a';
            setAccentColor(savedColor, false);
            updateColorPaletteUI(savedColor);
        }
    });

    document.getElementById('appearanceForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('appearanceSavedMsg').style.display = 'block';
        setTimeout(function(){
            document.getElementById('appearanceSavedMsg').style.display = 'none';
        }, 2000);
    };
    // Security form
    document.getElementById('securityForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('securitySavedMsg').style.display = 'block';
        setTimeout(function(){
            document.getElementById('securitySavedMsg').style.display = 'none';
        }, 2000);
    };
    // Delete account
    document.getElementById('deleteAccountBtn').onclick = function() {
        if (confirm('Are you sure you want to delete your account? This cannot be undone.')) {
            // Add delete logic here
            alert('Account deleted (demo only).');
        }
    };
    </script>
</body>
</html>
