<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Purchase!</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="diamond-button.css">
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
    <style>
        .thankyou-container {
            max-width: 480px;
            margin: 60px auto;
            background: #23203a;
            border-radius: 18px;
            box-shadow: 0 4px 32px #0005;
            padding: 48px 36px 40px 36px;
            text-align: center;
        }
        .thankyou-title {
            font-size: 2em;
            color: #4fd1ff;
            margin-bottom: 18px;
        }
        .thankyou-message {
            font-size: 1.2em;
            color: #fff;
            margin-bottom: 24px;
        }
        .diamond-icon {
            width: 48px;
            vertical-align: middle;
        }
        .return-btn {
            background: linear-gradient(90deg,#4fd1ff,#ff4d6d);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 32px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 12px #0003;
            transition: background 0.18s;
        }
    </style>
</head>
<body>
    <div class="thankyou-container">
        <img src="logos_and_profileicons/diamond.png" alt="Diamond" class="diamond-icon">
        <div class="thankyou-title">Thank You for Your Purchase!</div>
        <div class="thankyou-message">
            Your diamonds have been added to your account.<br>
            Enjoy your new perks and have fun!
        </div>
        <a href="index.html" class="return-btn">Return to Home</a>
    </div>
</body>
</html>
