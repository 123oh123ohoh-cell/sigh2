<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Chats</title>
  <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme-mode.js"></script>
  <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
</head>
<body>
  <!-- Header copied from index.html -->
  <header class="header">
    <a href="index.html" class="logo">
      <img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:50px; width:auto; display:block;">
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="chat2.html" id="chatHeaderBtn" class="nav-link" style="display:none;">Chat</a>
      <a href="#" class="nav-link">Live</a>
      <a href="model.html" class="nav-link">Models</a>
      <a href="#" class="nav-link">Categories</a>
      <a href="premium.html" class="nav-link">Premium</a>
      <a href="arts.html" class="nav-link">Arts</a>
    </nav>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search models...">
    </div>
    <span id="premiumBadgeHeader" style="display:inline-block;vertical-align:middle;margin-left:12px;margin-right:8px;"></span>
    <a href="upload.html" id="uploadNavBtn" class="btn" style="background:#ff2222;color:#fff;font-weight:700;padding:8px 22px;border-radius:8px;font-size:1.08em;vertical-align:middle;display:inline-block;box-shadow:0 2px 8px #0002;margin:0 18px 0 18px;transition:background 0.18s;">Upload</a>
    <div class="profile-dropdown">
      <button class="profile-btn" id="profileDropdownBtn" style="margin-left:0;vertical-align:middle;padding:0;background:none;border:none;">
        <img id="profileAvatarIcon" src="" alt="Profile" style="display:none;width:36px;height:36px;border-radius:50%;vertical-align:middle;object-fit:cover;">
        <span id="profileAvatarFallback" style="font-size:2em;vertical-align:middle;">👤</span>
      </button>
      <div class="dropdown-content" id="profileDropdownMenu">
        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="settings.html" id="settingsLink" style="display:none;">Settings</a>
        <a href="signout.html" id="signoutLink" style="display:none;">Sign Out</a>
        <a href="login.html" id="dropdownLogin">Log In</a>
        <a href="signup.html" id="dropdownSignup">Create Account</a>
      </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      async function updateDropdownMenu() {
        const loggedInUser = localStorage.getItem('loggedInUser');
        const token = localStorage.getItem('token');
        const profileLink = document.getElementById('profileLink');
        const signoutLink = document.getElementById('signoutLink');
        const dropdownLogin = document.getElementById('dropdownLogin');
        const dropdownSignup = document.getElementById('dropdownSignup');
        const chatHeaderBtn = document.getElementById('chatHeaderBtn');
        const premiumBadgeHeader = document.getElementById('premiumBadgeHeader');
        const profileAvatarIcon = document.getElementById('profileAvatarIcon');
        const profileAvatarFallback = document.getElementById('profileAvatarFallback');
        const settingsLink = document.getElementById('settingsLink');
        if (loggedInUser && token) {
          if (profileLink) {
            profileLink.style.display = '';
            profileLink.href = 'public-profile.html?user=' + encodeURIComponent(loggedInUser);
            profileLink.textContent = 'Profile';
          }
          if (signoutLink) signoutLink.style.display = '';
          if (settingsLink) settingsLink.style.display = '';
          if (dropdownLogin) dropdownLogin.style.display = 'none';
          if (dropdownSignup) dropdownSignup.style.display = 'none';
          if (chatHeaderBtn) chatHeaderBtn.style.display = '';
          let premiumTier = '';
          let avatar = '';
          try {
            const res = await fetch('https://ownshub.onrender.com/api/profile', {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
              const data = await res.json();
              premiumTier = data.premiumTier;
              avatar = data.avatar;
            }
          } catch {}
          if (premiumBadgeHeader) {
            if (premiumTier) {
              let color = '#ffd700';
              if (premiumTier === 'Silver') color = '#c0c0c0';
              if (premiumTier === 'Bronze') color = '#cd7f32';
              premiumBadgeHeader.innerHTML = `<span style="padding:1.5px 8px;border-radius:7px;background:${color};color:#181818;font-size:0.82em;font-weight:bold;vertical-align:middle;box-shadow:0 1px 4px #0002;letter-spacing:0.5px;">${premiumTier} Premium</span>`;
            } else {
              premiumBadgeHeader.innerHTML = '';
            }
          }
          if (profileAvatarIcon && avatar) {
            profileAvatarIcon.src = avatar;
            profileAvatarIcon.style.display = '';
            if (profileAvatarFallback) profileAvatarFallback.style.display = 'none';
          } else {
            if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
            if (profileAvatarFallback) profileAvatarFallback.style.display = '';
          }
        } else {
          if (profileLink) {
            profileLink.style.display = 'none';
            profileLink.href = 'profile.html';
            profileLink.textContent = 'Profile';
          }
          if (signoutLink) signoutLink.style.display = 'none';
          if (settingsLink) settingsLink.style.display = 'none';
          if (dropdownLogin) dropdownLogin.style.display = '';
          if (dropdownSignup) dropdownSignup.style.display = '';
          if (chatHeaderBtn) chatHeaderBtn.style.display = 'none';
          if (premiumBadgeHeader) premiumBadgeHeader.innerHTML = '';
          if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
          if (profileAvatarFallback) profileAvatarFallback.style.display = '';
        }
      }
      updateDropdownMenu();
      window.addEventListener('storage', function(e) {
        if (e.key === 'loggedInUser') {
          updateDropdownMenu();
        }
      });
      const dropdownBtn = document.getElementById('profileDropdownBtn');
      const dropdownMenu = document.getElementById('profileDropdownMenu');
      const dropdownContainer = dropdownBtn ? dropdownBtn.closest('.profile-dropdown') : null;
      if (dropdownBtn && dropdownMenu && dropdownContainer) {
        function closeDropdown() {
          dropdownMenu.classList.remove('show');
          dropdownContainer.classList.remove('show');
        }
        function openDropdown() {
          dropdownMenu.classList.add('show');
          dropdownContainer.classList.add('show');
        }
        function toggleDropdown(event) {
          event.stopPropagation();
          if (dropdownMenu.classList.contains('show')) {
            closeDropdown();
          } else {
            openDropdown();
          }
        }
        dropdownBtn.addEventListener('pointerdown', function(event) {
          event.preventDefault();
          toggleDropdown(event);
        });
        dropdownBtn.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            toggleDropdown(event);
          }
        });
        document.addEventListener('click', function(event) {
          if (!dropdownMenu.contains(event.target) && !dropdownBtn.contains(event.target)) {
            closeDropdown();
          }
        });
      }
    });
    </script>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
      if (typeof window.applySavedAppearance === 'function') {
        window.applySavedAppearance();
      }
    });
    </script>
  </header>

  <main class="main-content" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:60vh;">
    <h1 style="margin-top:2.5rem;margin-bottom:1.5rem;font-size:2.2rem;letter-spacing:1px;">All Chat Pages</h1>
    <div class="chat-list" style="display:flex;flex-wrap:wrap;gap:1.2rem;justify-content:center;margin-bottom:2rem;">
      <button class="chat-btn" onclick="location.href='chat2.html'">Chat 2</button>
      <button class="chat-btn" onclick="location.href='chat3.html'">Chat 3</button>
      <button class="chat-btn" onclick="location.href='chat4.html'">Chat 4</button>
      <button class="chat-btn" onclick="location.href='chat5.html'">Chat 5</button>
      <button class="chat-btn" onclick="location.href='chatVER6.html'">Chat VER6</button>
      <button class="chat-btn" onclick="location.href='chatVER7.html'">Chat VER7</button>
    </div>
  </main>

  <footer class="footer">
    <h4 style="font-weight:900; font-size:2.1rem; letter-spacing:2.5px; text-shadow:0 2px 10px #ffd6e0, 0 1px 0 #fff4; background:linear-gradient(90deg,#ffb6e6 10%,#ffd6e0 60%,#fff0 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 6px #ffd6e0); padding-right:2px; display:inline-flex; align-items:center;">ow <span style="font-size:1.1em;margin-left:4px;">❤️</span></h4>
    <div class="footer-links">
      <a href="#" class="footer-link">About</a>
      <a href="#" class="footer-link">Safety</a>
      <a href="#" class="footer-link">Terms</a>
      <a href="#" class="footer-link">Privacy</a>
      <a href="#" class="footer-link">Contact</a>
    </div>
    <p>&copy; 2024 own's hub. All rights reserved. Premium entertainment for everyone.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
