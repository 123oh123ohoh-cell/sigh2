<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girlfriend Arts - own's hub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme-mode.js"></script>
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
    <style>
        body {
            background: radial-gradient(ellipse at center, #fff6fb 0%, #ffdff1 42%, #ffb8df 72%, #ff7fc8 100%);
        }
        .arts-gallery-page {
            min-height: 90vh;
            background: transparent;
            padding: 80px 0 24px 0;
            position: relative;
        }
        .arts-gallery-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 12% 16%, rgba(255,255,255,0.55) 0 16px, transparent 17px),
                radial-gradient(circle at 86% 22%, rgba(255,255,255,0.45) 0 14px, transparent 15px),
                radial-gradient(circle at 74% 80%, rgba(255,255,255,0.4) 0 12px, transparent 13px),
                radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.72) 0%, rgba(255,184,223,0.28) 45%, rgba(255,127,200,0.16) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .arts-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 26px;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .arts-card {
            background: linear-gradient(145deg, #fff7fd 55%, #ffd9f0 100%);
            border-radius: 22px;
            padding: 20px 16px 16px 16px;
            width: 228px;
            box-shadow: 0 10px 28px rgba(255, 110, 190, 0.26);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #ff9ed7;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .arts-card::before,
        .arts-card::after {
            content: '';
            position: absolute;
            top: -11px;
            width: 18px;
            height: 14px;
            background: #ff7fc8;
            border: 2px solid #ff5cb8;
            border-radius: 90% 90% 90% 90%;
            z-index: 2;
        }
        .arts-card::before {
            left: 50%;
            transform: translateX(-100%) rotate(-14deg);
        }
        .arts-card::after {
            left: 50%;
            transform: translateX(0) rotate(14deg);
        }
        .arts-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(255, 110, 190, 0.38);
        }
        .arts-card img {
            width: 188px;
            height: 188px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #ffa7da;
            box-shadow: 0 4px 16px rgba(255, 110, 190, 0.24);
            margin-bottom: 10px;
        }
        .arts-card .title {
            color: #d4008f;
            font-weight: 700;
            font-size: 1.02em;
            text-align: center;
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.35em;
            letter-spacing: 1.2px;
            text-shadow: 0 4px 18px rgba(212, 0, 143, 0.45);
            font-family: 'Great Vibes', 'Pacifico', cursive, sans-serif;
        }
        @media (max-width: 600px) {
            .arts-gallery { gap: 14px; }
            .arts-card { width: 94vw; }
            .arts-card img { width: 84vw; height: 56vw; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:32px;vertical-align:middle;margin-right:8px;">own's hub</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="arts.html" class="nav-link">Arts</a>
            <a href="collections.html" class="nav-link nav-link-active">Collections</a>
        </nav>
    </header>
    <main class="arts-gallery-page">
        <h2>Girlfriend Arts</h2>
        <div class="arts-gallery">
            <div class="arts-card" onclick="showImageModal('girlfriend/girl1.jpg','Girl 1')"><img src="girlfriend/girl1.jpg" alt="Girl 1"><div class="title">Girl 1</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl1.webp','Girl 2')"><img src="girlfriend/girl1.webp" alt="Girl 2"><div class="title">Girl 2</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl3.jpg','Girl 3')"><img src="girlfriend/girl3.jpg" alt="Girl 3"><div class="title">Girl 3</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl4.jpeg','Girl 4')"><img src="girlfriend/girl4.jpeg" alt="Girl 4"><div class="title">Girl 4</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl5.webp','Girl 5')"><img src="girlfriend/girl5.webp" alt="Girl 5"><div class="title">Girl 5</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl6.webp','Girl 6')"><img src="girlfriend/girl6.webp" alt="Girl 6"><div class="title">Girl 6</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl7.jpg','Girl 7')"><img src="girlfriend/girl7.jpg" alt="Girl 7"><div class="title">Girl 7</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl8.jpg','Girl 8')"><img src="girlfriend/girl8.jpg" alt="Girl 8"><div class="title">Girl 8</div></div>
        </div>
        <div id="imageModal" style="display:none;position:fixed;z-index:10000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;">
            <div style="position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center;">
                <img id="modalImg" src="" alt="" style="max-width:74vw;max-height:72vh;border-radius:16px;box-shadow:0 4px 24px rgba(255,138,101,0.55);">
                <div id="modalTitle" style="color:#fff;font-size:1.2em;margin-top:14px;text-align:center;"></div>
                <button onclick="document.getElementById('imageModal').style.display='none'" style="margin-top:16px;padding:8px 24px;font-size:1em;background:#ff8a65;color:#fff;border:none;border-radius:8px;cursor:pointer;">Close</button>
            </div>
        </div>
        <script>
        function showImageModal(src, title) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('imageModal').style.display = 'flex';
        }
        </script>
    </main>
</body>
</html>
