<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - OwnsHub</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
</head>
<body>
  <header class="chat-app-header">
    <a href="index.html" class="logo">
      <img src="logos_and_profileicons/logo6.png" alt="Logo">
      OwnsHub
    </a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="arts.html">Arts</a>
      <a href="chat.html">Chat</a>
      <a href="contact.html" class="active" aria-current="page">Contact</a>
    </nav>
  </header>
  <main style="max-width:420px;margin:48px auto 0 auto;padding:32px 18px;background:var(--bg-2,#f7f7fa);border-radius:14px;box-shadow:0 2px 12px #0001;">
    <h2 style="margin-bottom:0.5em;">Contact Us</h2>
    <p style="margin-bottom:1.2em;">For questions, feedback, or support, please fill out the form below or email <a href="mailto:support@ownshub.com">support@ownshub.com</a>.</p>
    <form>
      <label style="display:block;margin-bottom:0.7em;">
        Your Email<br>
        <input type="email" name="email" required style="width:100%;padding:7px 10px;border-radius:7px;border:1px solid #ccc;">
      </label>
      <label style="display:block;margin-bottom:0.7em;">
        Message<br>
        <textarea name="message" rows="4" required style="width:100%;padding:7px 10px;border-radius:7px;border:1px solid #ccc;"></textarea>
      </label>
      <button type="submit" style="padding:8px 22px;border-radius:8px;background:#6c63ff;color:#fff;font-weight:600;border:none;cursor:pointer;">Send</button>
    </form>
  </main>
</body>
</html>
