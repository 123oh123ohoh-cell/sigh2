<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - own's hub</title>
    <link rel="stylesheet" href="styles.css">
<script src="theme-mode.js"></script>
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
</head>
<body>
    <div class="auth-container">
        <h2>Create Account</h2>
        <form id="signupForm">
            <input type="text" id="signupUsername" placeholder="Username" required>
            <input type="password" id="signupPassword" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <div id="signupProgress" style="display:none;margin-top:1em;text-align:center;">
            <span id="signupSpinner" style="display:inline-block;width:24px;height:24px;border:3px solid #ccc;border-top:3px solid #d12a7a;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;"></span>
            <span id="signupMsg" style="margin-left:0.7em;vertical-align:middle;font-size:1.1em;color:#d12a7a;">Creating your account...</span>
        </div>
        <style>@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}</style>
        <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
