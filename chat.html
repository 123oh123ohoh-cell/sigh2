      <!-- group management -->
      <div id="groupSection" class="group-section">
        <div class="group-header">Groups</div>
        <ul id="groupList" class="group-list"></ul>
        <div class="group-actions">
          <input id="newGroupName" type="text" placeholder="New group name" maxlength="32" style="width:60%">
          <button id="createGroupBtn" type="button">Create</button>
        </div>
      </div>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - OwnsHub</title>
  <link rel="stylesheet" href="chat.css">
  <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>

  <!-- ── HEADER ─────────────────────────────────────── -->
  <header class="chat-app-header">
    <a href="index.html" class="logo">
      <img src="logos_and_profileicons/logo6.png" alt="Logo">
      OwnsHub
    </a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="arts.html">Arts</a>
      <a href="#" id="chatNavBtn" class="active" aria-current="page">Chat</a>
    </nav>
    <div id="connectionStatus" class="status-indicator">
      <span id="statusDot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);"></span>
      <span id="statusText">Connecting…</span>
    </div>
    <select id="themeSelect" title="Theme" style="margin-left:18px;padding:4px 10px;border-radius:8px;background:var(--bg-surface);color:var(--text);border:1px solid var(--border);">
      <option value="dark">🌑 Dark</option>
      <option value="light">🌕 Light</option>
      <option value="blue">🔵 Blue</option>
    </select>
  </header>

  <!-- ── MAIN ───────────────────────────────────────── -->
  <div class="chat-app-main">

    <!-- SIDEBAR -->
    <aside class="chat-sidebar">
      <div class="sidebar-top">
        <input id="userSearchInput" type="text" placeholder="🔍  Search @username…" autocomplete="off">
        <div class="sidebar-status-row">
          <div class="sidebar-my-status">
            <span id="myStatusDot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);"></span>
            <span id="myStatusLabel">Online</span>
          </div>
          <select id="statusSelect" title="Set your status" style="flex:1;">
            <option value="online">🟢 Online</option>
            <option value="away">🟡 Away</option>
            <option value="dnd">🔴 Do Not Disturb</option>
          </select>
        </div>
      </div>
      <div class="sidebar-section-label">Groups</div>
      <div style="padding: 0 16px 8px; display: flex; flex-direction: column; gap: 8px;">
        <button id="createGroupBtn" style="width:100%;padding:7px 0;border-radius:8px;background:var(--accent-2);color:#fff;font-weight:600;border:none;cursor:pointer;">+ New Group</button>
        <button id="allChatsBtn" style="width:100%;padding:7px 0;border-radius:8px;background:#222;color:#ffd700;font-weight:600;border:1.5px solid #ffd700;cursor:pointer;">All Chats</button>
      </div>
      <ul id="groupList" class="user-list"></ul>
      <div class="sidebar-section-label">Direct Messages</div>
      <ul id="userList" class="user-list"></ul>
    </aside>

    <!-- CHAT PANEL -->
    <section class="chat-main">

      <!-- empty state -->
      <div id="emptyState">
        <div class="empty-icon">💬</div>
        <div class="empty-title">No chat open</div>
        <div class="empty-sub">Select someone from the sidebar to start messaging</div>
      </div>

      <!-- chat header -->
      <div id="chatHeader" class="chat-header" style="display:none;">
        <input id="messageSearchInput" type="text" placeholder="🔍 Search messages…" style="margin-left:16px;flex:1;max-width:320px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface);color:var(--text);font-size:0.98em;display:none;">
        <img id="chatHeaderAvatar" class="chat-header-avatar" src="" alt="">
        <div class="chat-header-info">
          <div id="chatHeaderName" class="chat-header-name">—</div>
          <div id="chatHeaderStatus" class="chat-header-status">—</div>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" id="blockUserBtn" title="Block user">🚫</button>
          <button class="icon-btn" id="muteUserBtn" title="Mute user">🔇</button>
          <button class="icon-btn" title="Profile" onclick="viewProfile()">👤</button>
        </div>
      </div>


      <!-- pins area -->
      <div id="pinsArea" class="pins-area" style="display:none;"></div>

      <!-- messages -->
      <div id="messagesArea" class="messages-area" style="display:none;"></div>

      <!-- typing indicator -->
      <div id="typingIndicator">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span id="typingText">someone is typing…</span>
      </div>

      <!-- GIF picker -->
      <div id="gifPicker">
        <input id="gifSearch" type="text" placeholder="Search GIFs (Tenor)…">
        <div id="gifResults"></div>
      </div>

      <!-- Emoji picker -->
      <div id="emojiPicker"></div>

      <!-- input area -->
      <div id="chatInputArea" class="chat-input-area" style="display:none;">
        <div class="input-toolbar">
          <button class="toolbar-btn" id="emojiToggleBtn" title="Emoji">😊</button>
          <button class="toolbar-btn" id="gifToggleBtn" title="GIF">GIF</button>
          <label class="toolbar-btn" title="Attach file" style="cursor:pointer;">
            📎<input type="file" id="fileInput" style="display:none;">
          </label>
        </div>
        <div id="imagePreviewWrap">
          <img id="imagePreview" src="" alt="preview">
          <button class="remove-img" id="removeImageBtn">✕</button>
        </div>
        <div class="input-row">
          <textarea id="chatInput" placeholder="Message…" rows="1" maxlength="2000"></textarea>
          <button id="sendBtn" type="button">Send</button>
        </div>
      </div>

    </section>
  </div>

  <script src="chat.js"></script>
  <script>
    // Intercept Chat nav button to load chat2.html
    document.getElementById('chatNavBtn').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'chat2.html';
    });
    // All Chats button
    document.getElementById('allChatsBtn').addEventListener('click', function() {
      window.location.href = 'all-chats.html';
    });
  </script>
</body>
</html>
