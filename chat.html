<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - OwnsHub</title>
  <link rel="stylesheet" href="styles.css">
<script src="theme-mode.js"></script>
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="header" style="margin-bottom:0;">
    <a href="index.html" class="logo"><img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:32px;vertical-align:middle;margin-right:8px;">own's hub</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="arts.html" class="nav-link">Arts</a>
    </nav>
    <span id="premiumBadgeHeader" style="display:inline-block;vertical-align:middle;margin-left:12px;margin-right:8px;"></span>
    <div class="profile-dropdown">
      <button class="profile-btn" id="profileDropdownBtn" style="margin-left:0;vertical-align:middle;padding:0;background:none;border:none;">
        <img id="profileAvatarIcon" src="" alt="Profile" style="display:none;width:36px;height:36px;border-radius:50%;vertical-align:middle;object-fit:cover;">
        <span id="profileAvatarFallback" style="font-size:2em;vertical-align:middle;">👤</span>
      </button>
      <div class="dropdown-content" id="profileDropdownMenu">
        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
        <a href="signout.html" id="signoutLink" style="display:none;">Sign Out</a>
        <a href="login.html" id="dropdownLogin">Log In</a>
        <a href="signup.html" id="dropdownSignup">Create Account</a>
      </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      async function updateDropdownMenu() {
        const loggedInUser = localStorage.getItem('loggedInUser');
        const token = localStorage.getItem('token');
        const profileLink = document.getElementById('profileLink');
        const signoutLink = document.getElementById('signoutLink');
        const dropdownLogin = document.getElementById('dropdownLogin');
        const dropdownSignup = document.getElementById('dropdownSignup');
        const premiumBadgeHeader = document.getElementById('premiumBadgeHeader');
        const profileAvatarIcon = document.getElementById('profileAvatarIcon');
        const profileAvatarFallback = document.getElementById('profileAvatarFallback');
        if (loggedInUser && token) {
          if (profileLink) profileLink.style.display = '';
          if (signoutLink) signoutLink.style.display = '';
          if (dropdownLogin) dropdownLogin.style.display = 'none';
          if (dropdownSignup) dropdownSignup.style.display = 'none';
          // Fetch premiumTier and avatar from backend
          let premiumTier = '';
          let avatar = '';
          try {
            const res = await fetch('https://ownshub.onrender.com/api/profile', {
              headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
              const data = await res.json();
              premiumTier = data.premiumTier;
              avatar = data.avatar;
            }
          } catch {}
          if (premiumBadgeHeader) {
            if (premiumTier) {
              let color = '#ffd700';
              if (premiumTier === 'Silver') color = '#c0c0c0';
              if (premiumTier === 'Bronze') color = '#cd7f32';
              premiumBadgeHeader.innerHTML = `<span style=\"padding:1.5px 8px;border-radius:7px;background:${color};color:#181818;font-size:0.82em;font-weight:bold;vertical-align:middle;box-shadow:0 1px 4px #0002;letter-spacing:0.5px;\">${premiumTier} Premium</span>`;
            } else {
              premiumBadgeHeader.innerHTML = '';
            }
          }
          // Set avatar icon
          if (profileAvatarIcon && avatar) {
            profileAvatarIcon.src = avatar;
            profileAvatarIcon.style.display = '';
            if (profileAvatarFallback) profileAvatarFallback.style.display = 'none';
          } else {
            if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
            if (profileAvatarFallback) profileAvatarFallback.style.display = '';
          }
        } else {
          if (profileLink) profileLink.style.display = 'none';
          if (signoutLink) signoutLink.style.display = 'none';
          if (dropdownLogin) dropdownLogin.style.display = '';
          if (dropdownSignup) dropdownSignup.style.display = '';
          if (premiumBadgeHeader) premiumBadgeHeader.innerHTML = '';
          if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
          if (profileAvatarFallback) profileAvatarFallback.style.display = '';
        }
      }
      updateDropdownMenu();
      window.addEventListener('storage', function(e) {
        if (e.key === 'loggedInUser') {
          updateDropdownMenu();
        }
      });
    });
    </script>
  </header>
  <div class="chat-container" style="max-width:600px;margin:40px auto 0 auto;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 24px 0 24px;">
      <h2 style="color:#ffb347;">Public Board</h2>
      <div style="position:relative;">
        <span id="notifBell" style="font-size:2em;cursor:pointer;">🔔</span>
        <span id="notifCount" style="position:absolute;top:-8px;right:-8px;background:#df1717;color:#fff;font-size:0.95em;font-weight:bold;border-radius:50%;padding:2px 8px;display:none;">0</span>
      </div>
    </div>
    <div id="messagesArea" style="background:#181818;margin:18px 0 0 0;padding:18px 24px 24px 24px;border-radius:12px;min-height:220px;max-height:400px;overflow-y:auto;"></div>
    <form id="postForm" style="display:flex;gap:12px;margin:18px 24px 0 24px;">
      <input type="text" id="postInput" placeholder="Write a post..." maxlength="200" style="flex:1;padding:10px 14px;border-radius:8px;border:1px solid #444;background:#232323;color:#fff;">
      <button type="submit" style="background:var(--gradient);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-weight:600;cursor:pointer;">Post</button>
    </form>
  </div>
  <script>
    // Simple public board logic with notification badge
    let posts = JSON.parse(localStorage.getItem('publicPosts') || '[]');
    let lastRead = parseInt(localStorage.getItem('publicPostsRead') || '0');
    function renderPosts() {
      const area = document.getElementById('messagesArea');
      if (!posts.length) {
        area.innerHTML = '<div style="color:#bbb;text-align:center;">No posts yet.</div>';
        return;
      }
      area.innerHTML = posts.map(post =>
        `<div style="background:#232323;padding:12px 16px;border-radius:8px;margin-bottom:10px;">
          <b style="color:#ffb347;">${post.user}</b> <span style="color:#888;font-size:0.92em;">${post.time}</span><br>${post.text}
        </div>`
      ).join('');
    }
    function updateNotif() {
      const notif = document.getElementById('notifCount');
      const unread = posts.length - lastRead;
      notif.textContent = unread;
      notif.style.display = unread > 0 ? '' : 'none';
    }
    document.getElementById('postForm').onsubmit = function(e) {
      e.preventDefault();
      const input = document.getElementById('postInput');
      const text = input.value.trim();
      if (!text) return;
      const user = localStorage.getItem('loggedInUser') || 'Anonymous';
      const now = new Date();
      const time = now.toLocaleString();
      posts.push({ user, text, time });
      localStorage.setItem('publicPosts', JSON.stringify(posts));
      input.value = '';
      renderPosts();
      updateNotif();
    };
    document.getElementById('notifBell').onclick = function() {
      lastRead = posts.length;
      localStorage.setItem('publicPostsRead', lastRead);
      updateNotif();
    };
    // Initial render
    renderPosts();
    updateNotif();
    // Mark all as read on load
    lastRead = posts.length;
    localStorage.setItem('publicPostsRead', lastRead);
    updateNotif();
  </script>
</body>
</html>
