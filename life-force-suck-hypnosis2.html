        <!-- Modal for zoom/focus/hypnosis -->
        <div id="imageModal" class="modal" style="display:none;">
            <div class="modal-bg"></div>
            <div class="modal-content">
                <div class="modal-hypno"></div>
                <img id="modalImg" src="" alt="Zoomed Image" style="max-width:60vw;max-height:60vh;border-radius:18px;box-shadow:0 4px 32px #ffb6d5cc;">
                <div id="modalTitle" class="modal-title"></div>

            </div>
        </div>
        <style>
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(40,0,60,0.55); z-index: 1000; display: flex; align-items: center; justify-content: center;
            animation: modal-fadein 0.3s;
        }
        .modal-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at center, #fff0fa 0%, #ffd6ec 60%, #ffb6d5 100%);
            opacity: 0.85; z-index: 1;
            filter: blur(2.5px) brightness(0.9);
        }
        .modal-content {
            position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
            background: rgba(255,255,255,0.13); border-radius: 22px; box-shadow: 0 8px 48px #ffb6d5cc;
            padding: 32px 24px 24px 24px; min-width: 320px; min-height: 320px;
            animation: modal-zoom 0.4s cubic-bezier(.4,2,.6,1);
        }
        .modal-hypno {
            width: 90px; height: 90px; border-radius: 50%; margin-bottom: 18px;
            background: repeating-conic-gradient(from 0deg, #fff0fa 0deg 20deg, #ffb6d5 20deg 40deg, #ff69b4 40deg 60deg, #ffd6ec 60deg 80deg);
            border: 3px solid #ff69b4;
            animation: spin 2.5s linear infinite;
            box-shadow: 0 0 24px #ffb6d5, 0 0 48px #ffd6ec;
        }
        .modal-content img {
            max-width: 60vw; max-height: 60vh; border-radius: 18px; box-shadow: 0 4px 32px #ffb6d5cc;
            margin-bottom: 18px; border: 3px solid #ff69b4;
            filter: drop-shadow(0 0 16px #fff8) drop-shadow(0 4px 18px #ffb6d5) blur(0.5px) brightness(1.08);
            transition: filter 0.3s, transform 0.3s;
            animation: modal-img-focus 1.2s cubic-bezier(.4,2,.6,1);
        }
        .modal-title {
            color: #d72660; font-size: 1.3em; font-weight: bold; text-align: center; margin-bottom: 8px;
            text-shadow: 0 1px 10px #fff0fa, 0 2px 14px #ffb6d5;
        }
        .modal-close {
            position: absolute; top: 8px; right: 18px; font-size: 2.2em; background: none; border: none; color: #ff69b4; cursor: pointer; z-index: 3;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #d72660; }
        @keyframes modal-fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modal-zoom { from { transform: scale(0.7); } to { transform: scale(1); } }
        @keyframes modal-img-focus { 0% { filter: blur(8px) brightness(0.7); } 100% { filter: blur(0.5px) brightness(1.08); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
        <script>
        function showImageModal(src, title) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').textContent = title || '';
            document.getElementById('imageModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageModal();
        });
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this || e.target.classList.contains('modal-bg')) closeImageModal();
        });
        </script>
