<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pornhub</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <style>
    body {
      margin: 0;
      background: #181818;
      font-family: 'Roboto', Arial, sans-serif;
      color: #fff;
    }
    header {
      background: #000;
      padding: 0 0 0 32px;
      display: flex;
      align-items: center;
      height: 72px;
      box-shadow: 0 2px 12px #000a;
    }
    .logo {
      font-size: 2.2em;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      margin-right: 18px;
    }
    .logo span {
      background: #ff9800;
      color: #181818;
      border-radius: 6px;
      padding: 0 10px;
      margin-left: 2px;
    }
    nav {
      margin-left: 32px;
      display: flex;
      gap: 24px;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1em;
      padding: 8px 0;
      transition: color 0.2s;
    }
    nav a:hover {
      color: #ff9800;
    }
    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px 18px;
      padding: 48px 32px 64px 32px;
      width: 100vw;
      min-height: calc(100vh - 72px);
      background: #181818;
      box-sizing: border-box;
    }
    .ph-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(135deg, #000 60%, #ff9800 100%);
      box-shadow: 0 6px 32px #ff980099, 0 2px 12px #000c;
      transition: transform 0.18s;
    }
    .ph-card:hover {
      transform: translateY(-6px) scale(1.025);
      box-shadow: 0 12px 40px #ff9800cc, 0 4px 16px #000e;
    }
    .ph-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      filter: brightness(0.92) contrast(1.08);
    }
    .ph-badge {
      position: absolute;
      top: 14px;
      left: 18px;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      color: #fff;
      font-size: 1.1em;
      padding: 4px 18px;
      border-radius: 14px;
      font-weight: 900;
      box-shadow: 0 2px 12px #ff9800cc;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px #000a;
      z-index: 6;
    }
    .ph-stats {
      position: absolute;
      bottom: 54px;
      right: 18px;
      background: linear-gradient(90deg, #000, #ff9800cc);
      color: #fff;
      font-size: 1em;
      padding: 4px 16px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 2px 12px #000c;
      display: flex;
      gap: 14px;
      align-items: center;
      text-shadow: 0 1px 4px #000a;
      z-index: 6;
    }
    .ph-timestamp {
      position: absolute;
      bottom: 14px;
      right: 16px;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      color: #fff;
      font-size: 1.15em;
      padding: 4px 14px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 2px 12px #ff9800cc;
      text-shadow: 0 1px 4px #000a;
      z-index: 4;
    }
    .ph-title {
      position: absolute;
      left: 18px;
      bottom: 14px;
      color: #fff;
      font-size: 1.15em;
      font-weight: 700;
      text-shadow: 0 2px 8px #000c;
      z-index: 5;
      max-width: 70%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    @media (max-width: 700px) {
      .main-grid {
        padding: 24px 4vw 48px 4vw;
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        height: auto;
        padding: 12px 0;
      }
      nav {
        margin-left: 0;
        margin-top: 8px;
        gap: 14px;
      }
    }
  </style>
</head>
<body>
