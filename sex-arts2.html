<head>

    <style>
        .profile-dropdown .dropdown-content { display: none; }
        .profile-dropdown .dropdown-content.show,
        .profile-dropdown.show .dropdown-content { display: block; }
        body {
            background: radial-gradient(ellipse at center, #ffb6d5 0%, #ff69b4 60%, #d72660 100%);
        }
        .arts-gallery-page {
            min-height: 90vh;
            background: transparent;
            padding: 80px 0 24px 0;
            position: relative;
        }
        .arts-gallery-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(255,182,213,0.7) 0%, rgba(255,105,180,0.3) 60%, rgba(215,38,96,0.2) 100%);
            z-index: 0;
            pointer-events: none;
        }
        .arts-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .arts-card {
            background: linear-gradient(145deg, #fff0fa 60%, #ffb6d5 100%);
            border-radius: 22px 22px 32px 32px;
            padding: 18px 16px 22px 16px;
            width: 240px;
            box-shadow: 0 4px 24px 4px rgba(255,105,180,0.18), 0 1.5px 0 #fff inset;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2.5px solid #ff69b4;
            position: relative;
            overflow: hidden;
        }
        .arts-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 38px;
            background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.09) 100%);
            border-radius: 22px 22px 0 0;
            pointer-events: none;
        }
        .arts-card img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 50% 50% 40% 40%/60% 60% 40% 40%;
            background: #fff0fa;
            box-shadow: 0 2px 16px 2px rgba(255,182,213,0.25);
            border: 3px solid #ff69b4;
            margin-bottom: 8px;
        }
        .arts-card .title {
            margin-top: 10px;
            font-weight: bold;
            color: #d72660;
            font-size: 1.18em;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 8px #fff0fa;
        }
        .arts-card .author {
            font-size: 1em;
            color: #ff69b4;
            margin: 4px 0 6px 0;
            font-weight: 500;
        }
        .arts-card .desc {
            font-size: 1em;
            color: #d72660;
            min-height: 32px;
            text-align: center;
            font-style: italic;
        }
        .arts-card .date {
            font-size: 0.9em;
            color: #b3005e;
            margin-top: 6px;
        }
        @media (max-width: 600px) {
            .arts-gallery { gap: 12px; }
            .arts-card { width: 98vw; padding: 8px; }
            .arts-card img { width: 90vw; height: 40vw; }
        }
        /* Modal styles */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(40,0,60,0.55); z-index: 1000; display: flex; align-items: center; justify-content: center;
            animation: modal-fadein 0.3s;
        }
        .modal-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at center, #fff0fa 0%, #ffd6ec 60%, #ffb6d5 100%);
            opacity: 0.85; z-index: 1;
            filter: blur(2.5px) brightness(0.9);
        }
        .modal-content {
            position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center;
            background: rgba(255,255,255,0.13); border-radius: 22px; box-shadow: 0 8px 48px #ffb6d5cc;
            padding: 32px 24px 24px 24px; min-width: 320px; min-height: 320px;
            animation: modal-zoom 0.4s cubic-bezier(.4,2,.6,1);
        }
        .modal-hypno {
            width: 90px; height: 90px; border-radius: 50%; margin-bottom: 18px;
            background: repeating-conic-gradient(from 0deg, #fff0fa 0deg 20deg, #ffb6d5 20deg 40deg, #ff69b4 40deg 60deg, #ffd6ec 60deg 80deg);
            border: 3px solid #ff69b4;
            animation: spin 2.5s linear infinite;
            box-shadow: 0 0 24px #ffb6d5, 0 0 48px #ffd6ec;
        }
        .modal-content img {
            max-width: 60vw; max-height: 60vh; border-radius: 18px; box-shadow: 0 4px 32px #ffb6d5cc;
            margin-bottom: 18px; border: 3px solid #ff69b4;
            filter: drop-shadow(0 0 16px #fff8) drop-shadow(0 4px 18px #ffb6d5) blur(0.5px) brightness(1.08);
            transition: filter 0.3s, transform 0.3s;
            animation: modal-img-focus 1.2s cubic-bezier(.4,2,.6,1);
        }
        .modal-title {
            color: #d72660; font-size: 1.3em; font-weight: bold; text-align: center; margin-bottom: 8px;
            text-shadow: 0 1px 10px #fff0fa, 0 2px 14px #ffb6d5;
        }
        .modal-desc {
            color: #d72660;
            font-size: 1em;
            text-align: center;
            max-width: min(86vw, 720px);
            line-height: 1.45;
            margin-bottom: 12px;
            text-shadow: 0 1px 8px #fff0fa;
        }
        .modal-close {
            position: absolute; top: 8px; right: 18px; font-size: 2.2em; background: none; border: none; color: #ff69b4; cursor: pointer; z-index: 3;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #d72660; }
        @keyframes modal-fadein { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modal-zoom { from { transform: scale(0.7); } to { transform: scale(1); } }
        @keyframes modal-img-focus { 0% { filter: blur(8px) brightness(0.7); } 100% { filter: blur(0.5px) brightness(1.08); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

        <script>
            // Dropdown toggle logic
            document.addEventListener('DOMContentLoaded', function() {
                const dropdownBtn = document.getElementById('profileDropdownBtn');
                const dropdownMenu = document.getElementById('profileDropdownMenu');
                if (dropdownBtn && dropdownMenu) {
                    dropdownBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        dropdownMenu.classList.toggle('show');
                    });
                    document.addEventListener('click', function(e) {
                        if (!dropdownMenu.contains(e.target) && !dropdownBtn.contains(e.target)) {
                            dropdownMenu.classList.remove('show');
                        }
                    });
                }
            });
            document.addEventListener('DOMContentLoaded', function() {
                async function updateDropdownMenu() {
                    const loggedInUser = localStorage.getItem('loggedInUser');
                    const token = localStorage.getItem('token');
                    const profileLink = document.getElementById('profileLink');
                    const signoutLink = document.getElementById('signoutLink');
                    const dropdownLogin = document.getElementById('dropdownLogin');
                    const dropdownSignup = document.getElementById('dropdownSignup');
                    const premiumBadgeHeader = document.getElementById('premiumBadgeHeader');
                    const profileAvatarIcon = document.getElementById('profileAvatarIcon');
                    const profileAvatarFallback = document.getElementById('profileAvatarFallback');
                    if (loggedInUser && token) {
                        if (profileLink) profileLink.style.display = '';
                        if (signoutLink) signoutLink.style.display = '';
                        if (dropdownLogin) dropdownLogin.style.display = 'none';
                        if (dropdownSignup) dropdownSignup.style.display = 'none';
                        // Fetch premiumTier and avatar from backend
                        let premiumTier = '';
                        let avatar = '';
                        try {
                            const res = await fetch('https://ownshub.onrender.com/api/profile', {
                                headers: { 'Authorization': 'Bearer ' + token }
                            });
                            if (res.ok) {
                                const data = await res.json();
                                premiumTier = data.premiumTier;
                                avatar = data.avatar;
                            }
                        } catch {}
                        if (premiumBadgeHeader) {
                            if (premiumTier) {
                                let color = '#ffd700';
                                if (premiumTier === 'Silver') color = '#c0c0c0';
                                if (premiumTier === 'Bronze') color = '#cd7f32';
                                premiumBadgeHeader.innerHTML = `<span style="padding:1.5px 8px;border-radius:7px;background:${color};color:#181818;font-size:0.82em;font-weight:bold;vertical-align:middle;box-shadow:0 1px 4px #0002;letter-spacing:0.5px;">${premiumTier} Premium</span>`;
                            } else {
                                premiumBadgeHeader.innerHTML = '';
                            }
                        }
                        // Set avatar icon
                        if (profileAvatarIcon && avatar) {
                            profileAvatarIcon.src = avatar;
                            profileAvatarIcon.style.display = '';
                            if (profileAvatarFallback) profileAvatarFallback.style.display = 'none';
                        } else {
                            if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
                            if (profileAvatarFallback) profileAvatarFallback.style.display = '';
                        }
                    } else {
                        if (profileLink) profileLink.style.display = 'none';
                        if (signoutLink) signoutLink.style.display = 'none';
                        if (dropdownLogin) dropdownLogin.style.display = '';
                        if (dropdownSignup) dropdownSignup.style.display = '';
                        if (premiumBadgeHeader) premiumBadgeHeader.innerHTML = '';
                        if (profileAvatarIcon) profileAvatarIcon.style.display = 'none';
                        if (profileAvatarFallback) profileAvatarFallback.style.display = '';
                    }
                }
                updateDropdownMenu();
                window.addEventListener('storage', function(e) {
                    if (e.key === 'loggedInUser') {
                        updateDropdownMenu();
                    }
                });
            });
        </script>

        <script>
        const JAPAN_ART_DESCRIPTIONS = {
            'Sex Arts 1': 'Ovary Anatomy, feminine energy.',
            'Sex Arts 2': 'Uterus Structure, new beginnings.',
            'Sex Arts 3': 'Fallopian Tubes, fertility and life.',
            'Sex Arts 4': 'Vagina, glossy and full of potential.',
            'Sex Arts 5': 'Cervix, inspired by the feminine form.',

            'Sex Arts 7': 'Clitoris, glossy, wet, and full of life.',
            'Sex Arts 8': 'Vulva, feminine power.',
            'Sex Arts 9': 'Egg Cell, wet, round, and radiant.',
            'Sex Arts 10': 'Endometrium, glossy ovum, new life.',
            'Sex Arts 11': 'Fimbriae, feminine, wet, and creative.',
            'Sex Arts 12': 'Mons Pubis, egg, ovary, and the start of life.',
            'Sex Arts 13': 'Bartholins Glands, nurturing and fluid.',
            'Sex Arts 14': 'Perineum, the bridge of life.'
        };

        function getJapanArtDescription(title) {
            return JAPAN_ART_DESCRIPTIONS[title] || 'Japan arts collection preview.';
        }

        function showImageModal(src, title, desc) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').textContent = title || '';
            document.getElementById('modalDesc').textContent = desc || getJapanArtDescription(title);
            document.getElementById('imageModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeImageModal();
        });
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this || e.target.classList.contains('modal-bg')) closeImageModal();
        });
