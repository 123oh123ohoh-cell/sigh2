<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vagina Collections - own's hub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme-mode.js"></script>
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
    <style>
        body {
            background: radial-gradient(ellipse at center, #fff6fb 0%, #ffdff1 42%, #ffb8df 72%, #ff7fc8 100%);
        }
        .arts-gallery-page {
            min-height: 90vh;
            background: transparent;
            padding: 80px 0 24px 0;
            position: relative;
        }
        /* Copy the ovary/egg/reproductive organ frame styles from girlfriend-2.html */
        .arts-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 34px;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .arts-card {
            background: radial-gradient(ellipse at 50% 60%, #fff6fb 60%, #ffdff1 100%),
                        repeating-linear-gradient(135deg, #ffb8df22 0 8px, transparent 8px 16px),
                        radial-gradient(ellipse at 60% 80%, #ffb8df44 0 30%, transparent 70%);
            border-radius: 65% 65% 90% 90%/90% 90% 100% 100%;
            padding: 32px 26px 44px 26px;
            width: 238px;
            box-shadow: 0 16px 44px 14px rgba(255, 110, 190, 0.32), 0 4px 0 #fff inset, 0 0 32px 8px #ffb8df55;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 5px double #ff69b4;
            position: relative;
            overflow: visible;
            cursor: pointer;
            outline: 5px solid #ffb8df;
            outline-offset: 0px;
            transition: box-shadow 0.3s, outline 0.3s;
        }
        .arts-card:hover {
            box-shadow: 0 24px 64px 24px #ff7fc888, 0 8px 0 #fff inset, 0 0 48px 16px #ffb8df99;
            outline: 6px solid #ff69b4;
        }
        .arts-card img {
            width: 158px;
            height: 192px;
            object-fit: cover;
            border-radius: 70% 70% 100% 100%/100% 100% 100% 100%;
            background: radial-gradient(ellipse at 50% 60%, #fff6fb 80%, #ffdff1 100%),
                        repeating-linear-gradient(120deg, #ffb8df33 0 10px, transparent 10px 20px);
            box-shadow: 0 8px 36px 12px #fff, 0 8px 24px 8px #ffb8df88, 0 0 32px 8px #ffb8df55;
            border: 5px double #ff69b4;
            margin-bottom: 12px;
            outline: 4px solid #ffb8df;
            outline-offset: 0px;
            position: relative;
        }
        .arts-card .title {
            margin-top: 10px;
            font-weight: bold;
            color: #d4008f;
            font-size: 1.12em;
            letter-spacing: 0.4px;
            text-align: center;
        }
        .arts-card .desc {
            font-size: 0.96em;
            color: #ab006d;
            min-height: 30px;
            text-align: center;
            font-style: italic;
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.4em;
            letter-spacing: 2px;
            text-shadow: 0 4px 24px rgba(212, 0, 143, 0.5), 0 1px 0 #fff4f0;
            font-family: 'Great Vibes', 'Pacifico', cursive, sans-serif;
        }
        .hypnosis-link {
            display: inline-block;
            margin: 0 auto 22px auto;
            padding: 10px 22px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            color: #d4008f;
            border: 2px solid #ff9ed7;
            background: linear-gradient(145deg, #fff7fd 60%, #ffd9f0 100%);
            box-shadow: 0 6px 18px rgba(255, 110, 190, 0.24);
        }
        .hypnosis-link:hover {
            color: #ab006d;
            box-shadow: 0 10px 24px rgba(255, 110, 190, 0.36);
        }
        body.mobile-mode .header {
            padding: 10px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
        }
        body.mobile-mode .logo {
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
        }
        body.mobile-mode .nav-links {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        body.mobile-mode .nav-link {
            text-align: center;
            padding: 8px 6px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.3);
        }
        body.mobile-mode .arts-gallery-page {
            padding: 64px 10px 20px 10px;
        }
        body.mobile-mode h2 {
            font-size: 1.6rem;
            margin-bottom: 16px;
            letter-spacing: 0.8px;
        }
        body.mobile-mode .hypnosis-link {
            width: min(94vw, 340px);
            text-align: center;
        }
        body.mobile-mode .arts-gallery {
            gap: 12px;
        }
        body.mobile-mode .arts-card {
            width: min(96vw, 420px);
            padding: 14px 12px 16px 12px;
            border-radius: 38px;
        }
        body.mobile-mode .arts-card img {
            width: min(88vw, 330px);
            height: auto;
            aspect-ratio: 4 / 5;
        }
        body.mobile-mode #imageModal {
            padding: 12px;
            height: calc(var(--app-vh, 1vh) * 100);
        }
        body.mobile-mode #modalImg {
            max-width: 92vw !important;
            max-height: 58vh !important;
        }
        @media (max-width: 600px) {
            .arts-gallery { gap: 14px; }
            .arts-card { width: 98vw; padding: 12px; }
            .arts-card img { width: 80vw; height: 42vw; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:32px;vertical-align:middle;margin-right:8px;">own's hub</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="arts.html" class="nav-link">Arts</a>
            <a href="collections-2.html" class="nav-link nav-link-active">Collections</a>
        </nav>
    </header>
    <main class="arts-gallery-page">
        <h2>Vagina Collections</h2>
        <div style="text-align:center;">
            <a href="vagina-hypnosis.html" class="hypnosis-link">Vagina Hypnosis</a>
        </div>
        <div class="arts-gallery">
            <div class="arts-card" onclick="showImageModal('public/hijabarts/(m=q18T2ZXbeaSaaTbaAaaaa)(mh=zJMuchy9Z1JP4GC7)0.jpg','Hijab Vagina','A feminine, ovary-inspired collection with hijab themes.')"><img src="public/hijabarts/(m=q18T2ZXbeaSaaTbaAaaaa)(mh=zJMuchy9Z1JP4GC7)0.jpg" alt="Hijab Vagina"><div class="title">Hijab Vagina</div><div class="desc">A feminine, ovary-inspired collection with hijab themes.</div></div>
            <div class="arts-card" onclick="showImageModal('public/imagetab/IMG_0842.png','Japan Vagina','A collection inspired by Japanese aesthetics and feminine forms.')"><img src="public/imagetab/IMG_0842.png" alt="Japan Vagina"><div class="title">Japan Vagina</div><div class="desc">A collection inspired by Japanese aesthetics and feminine forms.</div></div>
            <div class="arts-card" onclick="showImageModal('girlfriend/girl1.jpg','Girlfriend Vagina','A soft, nurturing, and ovary-themed girlfriend collection.')"><img src="girlfriend/girl1.jpg" alt="Girlfriend Vagina"><div class="title">Girlfriend Vagina</div><div class="desc">A soft, nurturing, and ovary-themed girlfriend collection.</div></div>
        </div>
        <div id="imageModal" style="display:none;position:fixed;z-index:10000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;">
            <div style="position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center;">
                <img id="modalImg" src="" alt="" style="max-width:60vw;max-height:60vh;border-radius:18px;box-shadow:0 4px 32px rgba(255,110,190,0.55);">
                <div id="modalTitle" style="color:#fff;font-size:1.3em;margin-top:18px;text-align:center;text-shadow:0 2px 10px rgba(255,110,190,0.8);"></div>
                <div id="modalDesc" style="color:#fff;font-size:1em;margin-top:8px;text-align:center;"></div>
                <button onclick="document.getElementById('imageModal').style.display='none'" style="margin-top:18px;padding:8px 28px;font-size:1.1em;background:#ff5cb8;color:#fff;border:none;border-radius:8px;cursor:pointer;">Close</button>
            </div>
        </div>
        <script>
        function showImageModal(src, title, desc) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('imageModal').style.display = 'flex';
        }
        </script>
    </main>
</body>
</html>
