<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Arts - own's hub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme-mode.js"></script>
    <link rel="icon" type="image/png" href="logos_and_profileicons/logo6.png">
    <style>
        body {
            background: radial-gradient(ellipse at center, #fff4f0 0%, #ffd9cc 45%, #ffb8a3 75%, #ff8a65 100%);
        }
        .arts-gallery-page {
            min-height: 90vh;
            background: transparent;
            padding: 80px 0 24px 0;
            position: relative;
        }
        .arts-gallery-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.8) 0%, rgba(255,176,140,0.35) 40%, rgba(255,138,101,0.18) 100%);
            pointer-events: none;
            z-index: 0;
        }
        .arts-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 26px;
            justify-content: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .arts-card {
            background: linear-gradient(145deg, #fff7f3 55%, #ffe4db 100%);
            border-radius: 20px;
            padding: 16px;
            width: 228px;
            box-shadow: 0 8px 28px rgba(255, 138, 101, 0.28);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #ffb39b;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .arts-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 34px rgba(255, 138, 101, 0.38);
        }
        .arts-card img {
            width: 188px;
            height: 188px;
            object-fit: cover;
            border-radius: 14px;
            border: 2px solid #ffb39b;
            box-shadow: 0 4px 16px rgba(255, 138, 101, 0.25);
            margin-bottom: 10px;
        }
        .arts-card .title {
            color: #cf4f29;
            font-weight: 700;
            font-size: 1.02em;
            text-align: center;
        }
        h2 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.35em;
            letter-spacing: 1.2px;
            text-shadow: 0 4px 18px rgba(207, 79, 41, 0.55);
            font-family: 'Pacifico', cursive, sans-serif;
        }
        @media (max-width: 600px) {
            .arts-gallery { gap: 14px; }
            .arts-card { width: 94vw; }
            .arts-card img { width: 84vw; height: 56vw; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo"><img src="logos_and_profileicons/logo6.png" alt="Logo" style="height:32px;vertical-align:middle;margin-right:8px;">own's hub</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="arts.html" class="nav-link">Arts</a>
            <a href="collections.html" class="nav-link nav-link-active">Collections</a>
        </nav>
    </header>
    <main class="arts-gallery-page">
        <h2>Raw Arts</h2>
        <div class="arts-gallery">
            <div class="arts-card" onclick="showImageModal('raw/(m=bKW1KNV)(mh=VQSsKwmRtJrkt1Dk)52229511a.jpg','Raw Art 1','A sensual raw atmosphere with a soft romantic pull.')"><img src="raw/(m=bKW1KNV)(mh=VQSsKwmRtJrkt1Dk)52229511a.jpg" alt="Raw Art 1"><div class="title">Raw Art 1</div></div>
            <div class="arts-card" onclick="showImageModal('raw/(m=eaSaaTbWx)(mh=3_MGbrsmDlmjsHu1)12.jpg','Raw Art 2','Textured highlights and a slow, pulsing romantic rhythm.')"><img src="raw/(m=eaSaaTbWx)(mh=3_MGbrsmDlmjsHu1)12.jpg" alt="Raw Art 2"><div class="title">Raw Art 2</div></div>
            <div class="arts-card" onclick="showImageModal('raw/(m=eGM68f)(mh=YwQcCAOWDJQsa4FU)0.jpg','Raw Art 3','Muted tones with sensual raw detail and intimate warmth.')"><img src="raw/(m=eGM68f)(mh=YwQcCAOWDJQsa4FU)0.jpg" alt="Raw Art 3"><div class="title">Raw Art 3</div></div>
            <div class="arts-card" onclick="showImageModal('raw/1913348.jpg','Raw Art 4','Romantic raw energy that feels deep and gently pulsing.')"><img src="raw/1913348.jpg" alt="Raw Art 4"><div class="title">Raw Art 4</div></div>
            <div class="arts-card" onclick="showImageModal('raw/3.jpg','Raw Art 5','Warm sensual shades with a tender, raw romantic glow.')"><img src="raw/3.jpg" alt="Raw Art 5"><div class="title">Raw Art 5</div></div>
            <div class="arts-card" onclick="showImageModal('raw/7.jpg','Raw Art 6','Direct raw focus with a heartbeat-like romantic pulse.')"><img src="raw/7.jpg" alt="Raw Art 6"><div class="title">Raw Art 6</div></div>
            <div class="arts-card" onclick="showImageModal('raw/78.jpg','Raw Art 7','Grainy sensual mood and romantic framing that lingers.')"><img src="raw/78.jpg" alt="Raw Art 7"><div class="title">Raw Art 7</div></div>
            <div class="arts-card" onclick="showImageModal('raw/have-some-hard-action-with-lisey-sweet-3b711ee4f3.jpg','Raw Art 8','High-impact raw intensity with soft romantic undertones.')"><img src="raw/have-some-hard-action-with-lisey-sweet-3b711ee4f3.jpg" alt="Raw Art 8"><div class="title">Raw Art 8</div></div>
            <div class="arts-card" onclick="showImageModal('raw/preview.jpg','Raw Art 9','A minimal raw still carrying sensual romantic tension.')"><img src="raw/preview.jpg" alt="Raw Art 9"><div class="title">Raw Art 9</div></div>
            <div class="arts-card" onclick="showImageModal('raw/preview_lq.mp4.webp','Raw Art 10','Rough motion texture with a soft, pulsing romantic feel.')"><img src="raw/preview_lq.mp4.webp" alt="Raw Art 10"><div class="title">Raw Art 10</div></div>
            <div class="arts-card" onclick="showImageModal('raw/rs_fit_1280_720.avif','Raw Art 11','Wide raw composition with sensual balance and calm pulse.')"><img src="raw/rs_fit_1280_720.avif" alt="Raw Art 11"><div class="title">Raw Art 11</div></div>
        </div>
        <div id="imageModal" style="display:none;position:fixed;z-index:10000;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;">
            <div style="position:relative;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;align-items:center;">
                <img id="modalImg" src="" alt="" style="max-width:74vw;max-height:72vh;border-radius:16px;box-shadow:0 4px 24px rgba(255,138,101,0.55);">
                <div id="modalTitle" style="color:#fff;font-size:1.2em;margin-top:14px;text-align:center;"></div>
                <div id="modalDesc" style="color:#fff;font-size:1em;margin-top:8px;text-align:center;"></div>
                <button onclick="document.getElementById('imageModal').style.display='none'" style="margin-top:16px;padding:8px 24px;font-size:1em;background:#ff8a65;color:#fff;border:none;border-radius:8px;cursor:pointer;">Close</button>
            </div>
        </div>
        <script>
        function showImageModal(src, title, desc) {
            document.getElementById('modalImg').src = src;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || '';
            document.getElementById('imageModal').style.display = 'flex';
        }
        </script>
    </main>
</body>
</html>
